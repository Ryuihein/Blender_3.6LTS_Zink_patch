name: Build Blender 3.6 LTS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # Enable ARM64 Execution Emulation via QEMU
      - name: Set up QEMU for ARM64 Execution
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Cache Android NDK r21e
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk-r21e
          key: ndk-r21e-linux-x86_64

      - name: Install NDK if not cached
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/ndk-download
          curl -L -o $HOME/ndk-download/ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q $HOME/ndk-download/ndk.zip -d $HOME/
          rm -rf $HOME/ndk-download

      - name: Configure NDK Environment Path
        run: |
          mkdir -p $ANDROID_HOME/ndk
          ln -s $HOME/android-ndk-r21e $ANDROID_HOME/ndk/21.4.7075529

      - name: Install Build Tools
        run: |
          sudo apt-get install -y cmake ninja-build python3 gettext git

      - name: Clone All Sibling Repositories
        run: |
          cd ..
          git clone --depth 1 https://github.com/dshawshank/lib-android_arm64.git lib-android_arm64
          git clone --depth 1 https://github.com/dshawshank/Utilities-android_arm64.git Utilities-android_arm64
          git clone --depth 1 --branch blender-v3.6-release https://github.com/dshawshank/Blender-android_arm64.git Blender-android_arm64
          git clone --depth 1 https://github.com/dshawshank/APP-android_arm64.git APP-android_arm64

      - name: Structuring Dependency Headers
        run: |
          LIB_ROOT="${GITHUB_WORKSPACE}/.."
          LIB_ANDROID="${LIB_ROOT}/lib-android_arm64"
          BLENDER_ROOT="${LIB_ROOT}/Blender-android_arm64"
          
          # CPython Header Sync
          PY_SRC_DIR=$(dirname $(find "${LIB_ANDROID}/cpython" -name "Python.h" | head -n 1))
          if [ -n "${PY_SRC_DIR}" ]; then
            mkdir -p "${LIB_ANDROID}/cpython/include/include"
            cp -r "${PY_SRC_DIR}"/* "${LIB_ANDROID}/cpython/include/" 2>/dev/null || true
            cp -r "${PY_SRC_DIR}"/* "${LIB_ANDROID}/cpython/include/include/" 2>/dev/null || true
          fi

          # PNG Header Sync
          find "${LIB_ANDROID}/Png" -name "pnglibconf.h.prebuilt" -execdir cp -n {} pnglibconf.h \; 2>/dev/null || true
          PNG_TARGET=$(dirname $(find "${LIB_ANDROID}/Png" -name "png.h" | head -n 1))
          if [ -n "${PNG_TARGET}" ]; then
            find "${LIB_ANDROID}/Png" -name "*.h" -exec cp -n {} "${PNG_TARGET}/" 2>/dev/null \; || true
          fi

      - name: Setup Gradle 6.9.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.9.4'

      - name: Patch Hardcoded Windows Paths
        run: |
          PARENT_ROOT=$(cd "${GITHUB_WORKSPACE}/.." && pwd)
          # Replace both forward slash and backslash Windows path patterns
          find "${PARENT_ROOT}" -type f \( -name "*.cmake" -o -name "*.txt" -o -name "*.gradle" -o -name "*.ninja" -o -name "*.properties" \) \
            -exec sed -i "s|D:/FreeProjects/Blender/Blender|${PARENT_ROOT}|g; s|D:\\\\FreeProjects\\\\Blender\\\\Blender|${PARENT_ROOT}|g" {} +

      - name: Multi-Stage Bootstrap Build
        run: |
          PARENT_ROOT=$(cd "${GITHUB_WORKSPACE}/.." && pwd)
          BLENDER_SRC="${PARENT_ROOT}/Blender-android_arm64"
          MAKEBLENDER_DIR="${PARENT_ROOT}/Utilities-android_arm64/MakeBlender"
          MAKEBLENDER_CXX="${MAKEBLENDER_DIR}/app/.cxx/cmake/release/arm64-v8a"
          
          # Define system environment maps for QEMU to resolve Android Bionic C Libraries
          export QEMU_LD_PREFIX="${ANDROID_HOME}/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          echo "=== STAGE 1: First-Pass Compilation (Building libmakesdna.a) ==="
          cd "${MAKEBLENDER_DIR}"
          gradle :app:generateJsonModelRelease
          # Explicitly invoke Ninja to build only the code-generator binaries we need right now
          ninja -C "${MAKEBLENDER_CXX}" makesdna source/creator/msgfmt source/creator/datatoc

          echo "=== STAGE 2: Replicating MakeSDNA via QEMU ==="
          # Establish target directories inside the Android CXX build stream
          SDNA_TARGET_CXX="${MAKEBLENDER_CXX}/source/blender/makesdna/intern"
          mkdir -p "${SDNA_TARGET_CXX}"
          
          # Emulate and execute the ARM64 Android makesdna binary directly on the Ubuntu runner
          qemu-aarch64-static "${MAKEBLENDER_CXX}/bin/makesdna" \
            "${BLENDER_SRC}/source/blender/makesdna/DNA_struct_list.h" \
            "${SDNA_TARGET_CXX}/dna.c" \
            "${SDNA_TARGET_CXX}/dna_type_offsets.h" \
            "${SDNA_TARGET_CXX}/dna_verify.c" \
            "${BLENDER_SRC}/source/blender/makesdna/"

          # Process the text replacements required by Step 9 in the documentation
          sed -i "s|/data/data/com.epai.makesdna/makesdna|${BLENDER_SRC}/source/blender/makesdna|g" "${SDNA_TARGET_CXX}/dna_verify.c"

          # Synchronize auxiliary binaries (Step 8)
          mkdir -p "${MAKEBLENDER_CXX}/bin"
          cp "${MAKEBLENDER_CXX}/bin/msgfmt" "${MAKEBLENDER_CXX}/source/creator/" || true
          cp "${MAKEBLENDER_CXX}/bin/datatoc" "${MAKEBLENDER_CXX}/source/creator/" || true

          echo "=== STAGE 3: Second-Pass Compilation (Building libmakesrna.a) ==="
          # Re-trigger to consume the freshly generated DNA structures
          ninja -C "${MAKEBLENDER_CXX}" makesrna bf_intern_ghost

          echo "=== STAGE 4: Replicating MakeSRNA via QEMU ==="
          RNA_TARGET_CXX="${MAKEBLENDER_CXX}/source/blender/makesrna/intern"
          RNA_TARGET_SOURCE="${BLENDER_SRC}/source/blender/makesrna"
          mkdir -p "${RNA_TARGET_CXX}" "${RNA_TARGET_SOURCE}"

          # Emulate the SRNA code generation binary
          qemu-aarch64-static "${MAKEBLENDER_CXX}/bin/makesrna" \
            "${RNA_TARGET_CXX}/" \
            "${MAKEBLENDER_CXX}/source/blender/makesrna/"

          # Distribute the headers exactly where Blender's build tools expect them (Steps 16 & 17)
          find "${RNA_TARGET_CXX}" -name "RNA_*.h" -exec cp -n {} "${RNA_TARGET_SOURCE}/" \; 2>/dev/null || true

          echo "=== STAGE 5: Third-Pass Compilation (Full Blender Core Build) ==="
          # Execute the final compilation pass to tie all structural code segments together
          gradle assembleRelease

      - name: Build Android APK (OBlender)
        run: |
          PARENT_ROOT=$(cd "${GITHUB_WORKSPACE}/.." && pwd)
          cd "${PARENT_ROOT}/APP-android_arm64/OBlender"
          gradle assembleDebug

      - name: Collect APK Artifacts
        run: |
          mkdir -p ${{ github.workspace }}/output
          find ${{ github.workspace }}/.. -name "*.apk" -exec cp {} ${{ github.workspace }}/output/ \;

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blender-3.6-Zink-ARM64
          path: ${{ github.workspace }}/output/*.apk
