name: Build Blender 3.6 LTS aarch64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Toolchain Setup
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Download and Install NDK 21.4.7075529 (r21e)
        run: |
          mkdir -p $ANDROID_HOME/ndk
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q ndk.zip -d $ANDROID_HOME/ndk/
          mv $ANDROID_HOME/ndk/android-ndk-r21e $ANDROID_HOME/ndk/21.4.7075529
          rm ndk.zip

      # Step 2: Build Dependencies & Sibling Repositories
      - name: Install CMake, Ninja & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 gettext git

      - name: Clone Sibling Repositories
        run: |
          cd ..
          git clone https://github.com/dshawshank/lib-android_arm64.git lib-android_arm64
          git clone https://github.com/dshawshank/Utilities-android_arm64.git Utilities-android_arm64
          git clone --branch blender-v3.6-release https://github.com/dshawshank/Blender-android_arm64.git Blender-android_arm64

      - name: Fix Python Header Directory Mismatch
        run: |
          echo "=== Dynamically locating and structuring Python headers ==="
          LIB_ROOT="/home/runner/work/Blender_3.6LTS_Zink_patch/lib-android_arm64"
          TARGET_DIR="${LIB_ROOT}/cpython/include/include"
          
          mkdir -p "${TARGET_DIR}"
          
          # Find the exact directory containing Python.h inside lib-android_arm64
          HEADER_DIR=$(find "${LIB_ROOT}" -name "Python.h" -exec dirname {} \; | head -n 1)
          
          if [ -z "${HEADER_DIR}" ]; then
            echo "::error::Python.h was not found anywhere inside lib-android_arm64!"
            exit 1
          fi
          
          echo "Found Python.h in: ${HEADER_DIR}"
          cp -r "${HEADER_DIR}"/* "${TARGET_DIR}/"
          
          # Verify header presence before starting Gradle
          ls -la "${TARGET_DIR}/Python.h"

      - name: Fix PNG Header Directory Structure
        run: |
          echo "=== Synchronizing PNG headers across include paths ==="
          PNG_ROOT="/home/runner/work/Blender_3.6LTS_Zink_patch/lib-android_arm64/Png"
          
          # Find all directories containing pnglibconf.h and png.h
          PNG_H_DIR=$(find "${PNG_ROOT}" -name "png.h" -exec dirname {} \; | head -n 1)
          CONF_DIR=$(find "${PNG_ROOT}" -name "pnglibconf.h" -exec dirname {} \; | head -n 1)
          
          if [ -n "${CONF_DIR}" ] && [ -n "${PNG_H_DIR}" ]; then
            echo "Copying ${CONF_DIR} headers to ${PNG_H_DIR}"
            cp -r "${CONF_DIR}"/*.h "${PNG_H_DIR}/" 2>/dev/null || true
            
            # Ensure top-level include directory also holds all png headers
            mkdir -p "${PNG_ROOT}/include"
            cp -r "${CONF_DIR}"/*.h "${PNG_ROOT}/include/" 2>/dev/null || true
          fi

      - name: Flatten All Dependency Headers
        run: |
          echo "=== Auto-consolidating header files in lib-android_arm64 ==="
          LIB_ROOT="/home/runner/work/Blender_3.6LTS_Zink_patch/lib-android_arm64"
          
          # Iterate over all library subdirectories
          for dir in "${LIB_ROOT}"/*/; do
            if [ -d "$dir" ]; then
              # Create a unified include directory if missing
              mkdir -p "${dir}include"
              # Find all headers in subfolders and mirror them into the library's include directory
              find "${dir}" -name "*.h" -exec cp {} "${dir}include/" 2>/dev/null \; || true
            fi
          done
          
          # Fix specific Python double-include path expectation
          PY_TARGET="${LIB_ROOT}/cpython/include/include"
          mkdir -p "${PY_TARGET}"
          PY_DIR=$(find "${LIB_ROOT}/cpython" -name "Python.h" -exec dirname {} \; | head -n 1)
          [ -n "${PY_DIR}" ] && cp -r "${PY_DIR}"/* "${PY_TARGET}/" 2>/dev/null || true
          
      # Step 3: Verify Manually Uploaded Drivers
      - name: Verify Staged Libraries
        run: |
          echo "=== Staged Drivers in jniLibs ==="
          ls -la OBlender/app/src/main/jniLibs/arm64-v8a/
          
     
      # Step 3.5: Force Compatible Gradle Version
      - name: Setup Gradle 6.9.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.9.4'

      - name: Patch Hardcoded Windows Paths
        run: |
          echo "=== Patching Windows D: drive paths across all repos ==="
          PARENT_ROOT="/home/runner/work/Blender_3.6LTS_Zink_patch"
          
          # Replace Windows paths across all subdirectories and properties files
          find ${PARENT_ROOT} -type f \( -name "*.cmake" -o -name "*.txt" -o -name "*.gradle" -o -name "*.ninja" -o -name "*.properties" \) -exec sed -i "s|D:/FreeProjects/Blender/Blender|${PARENT_ROOT}|g" {} +
          
      - name: Build Core Blender Static Libraries
        run: |
          cd ../Utilities-android_arm64/MakeBlender
          gradle assembleRelease
          
      # Step 4: Compile & Build Debug APK
      - name: Build Android APK
        run: |
          cd OBlender
          gradle assembleDebug

      # Step 5: Save compiled APK as Workflow Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blender-3.6-Zink-ARM64
          path: OBlender/app/build/outputs/apk/debug/*.apk
