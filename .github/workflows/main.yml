name: Build Blender Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11 (Required for Gradle 6.5)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Android SDK Manager
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: "true"

      - name: Install NDK 21.4.7075529 and Build Tools
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529" "build-tools;30.0.3" "platforms;android-30"

      - name: Verify Toolchain Setup
        run: |
          echo "NDK Location: ${ANDROID_HOME}/ndk/21.4.7075529"
          ls -la ${ANDROID_HOME}/ndk/21.4.7075529
