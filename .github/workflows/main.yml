name: Build Blender 3.6 LTS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # Enable ARM64 Execution Emulation via QEMU
      - name: Set up QEMU for ARM64 Execution
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Cache Android NDK r21e
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk-r21e
          key: ndk-r21e-linux-x86_64

      - name: Install NDK if not cached
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/ndk-download
          curl -L -o $HOME/ndk-download/ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q $HOME/ndk-download/ndk.zip -d $HOME/
          rm -rf $HOME/ndk-download

      - name: Configure NDK Environment Path
        run: |
          mkdir -p $ANDROID_HOME/ndk
          ln -s $HOME/android-ndk-r21e $ANDROID_HOME/ndk/21.4.7075529

      - name: Install Build Tools
        run: |
          sudo apt-get install -y cmake ninja-build python3 gettext git

      - name: Clone All Sibling Repositories
        run: |
          cd ..
          git clone --depth 1 https://github.com/dshawshank/lib-android_arm64.git lib-android_arm64
          git clone --depth 1 https://github.com/dshawshank/Utilities-android_arm64.git Utilities-android_arm64
          git clone --depth 1 --branch blender-v3.6-release https://github.com/dshawshank/Blender-android_arm64.git Blender-android_arm64
          git clone --depth 1 https://github.com/dshawshank/APP-android_arm64.git APP-android_arm64

      - name: Structuring Dependency Headers
        run: |
          LIB_ROOT="${GITHUB_WORKSPACE}/.."
          LIB_ANDROID="${LIB_ROOT}/lib-android_arm64"
          BLENDER_ROOT="${LIB_ROOT}/Blender-android_arm64"
          
          # CPython Header Sync
          PY_SRC_DIR=$(dirname $(find "${LIB_ANDROID}/cpython" -name "Python.h" | head -n 1))
          if [ -n "${PY_SRC_DIR}" ]; then
            mkdir -p "${LIB_ANDROID}/cpython/include/include"
            cp -r "${PY_SRC_DIR}"/* "${LIB_ANDROID}/cpython/include/" 2>/dev/null || true
            cp -r "${PY_SRC_DIR}"/* "${LIB_ANDROID}/cpython/include/include/" 2>/dev/null || true
          fi

          # PNG Header Sync
          find "${LIB_ANDROID}/Png" -name "pnglibconf.h.prebuilt" -execdir cp -n {} pnglibconf.h \; 2>/dev/null || true
          PNG_TARGET=$(dirname $(find "${LIB_ANDROID}/Png" -name "png.h" | head -n 1))
          if [ -n "${PNG_TARGET}" ]; then
            find "${LIB_ANDROID}/Png" -name "*.h" -exec cp -n {} "${PNG_TARGET}/" 2>/dev/null \; || true
          fi

      - name: Setup Gradle 6.9.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.9.4'

      - name: Patch Hardcoded Windows Paths
        run: |
          PARENT_ROOT=$(cd "${GITHUB_WORKSPACE}/.." && pwd)
          # Replace both forward slash and backslash Windows path patterns
          find "${PARENT_ROOT}" -type f \( -name "*.cmake" -o -name "*.txt" -o -name "*.gradle" -o -name "*.ninja" -o -name "*.properties" \) \
            -exec sed -i "s|D:/FreeProjects/Blender/Blender|${PARENT_ROOT}|g; s|D:\\\\FreeProjects\\\\Blender\\\\Blender|${PARENT_ROOT}|g" {} +

      - name: Multi-Stage Bootstrap Build
        run: |
          PARENT_ROOT=$(cd "${GITHUB_WORKSPACE}/.." && pwd)
          MAKEBLENDER_CXX="${PARENT_ROOT}/Utilities-android_arm64/MakeBlender/app/.cxx/cmake/release/arm64-v8a"
          BLENDER_SRC="${PARENT_ROOT}/Blender-android_arm64/source/blender/makesdna"

          echo "=== STAGE 1: Generating CMake Config for MakeBlender ==="
          cd "${PARENT_ROOT}/Utilities-android_arm64/MakeBlender"
          gradle :app:generateJsonModelRelease || true

          echo "=== STAGE 2: Building libmakesdna.a ==="
          if [ -d "${MAKEBLENDER_CXX}" ]; then
            ninja -C "${MAKEBLENDER_CXX}" makesdna || true
          fi

          echo "=== STAGE 3: Running MakeSDNA & Syncing DNA Headers ==="
          cd "${PARENT_ROOT}/Utilities-android_arm64/MakeSDNA"
          gradle assembleRelease
          
          # Copy generated DNA C/Header files into BOTH the build target and source tree
          SDNA_TARGET_CXX="${MAKEBLENDER_CXX}/source/blender/makesdna/intern"
          SDNA_TARGET_SRC_INTERN="${PARENT_ROOT}/Blender-android_arm64/source/blender/makesdna/intern"
          SDNA_TARGET_SRC_ROOT="${PARENT_ROOT}/Blender-android_arm64/source/blender/makesdna"

          mkdir -p "${SDNA_TARGET_CXX}" "${SDNA_TARGET_SRC_INTERN}" "${SDNA_TARGET_SRC_ROOT}"
          
          find "${PARENT_ROOT}" -name "dna.c" -exec cp {} "${SDNA_TARGET_CXX}/" \; -exec cp {} "${SDNA_TARGET_SRC_INTERN}/" \; 2>/dev/null || true
          find "${PARENT_ROOT}" -name "dna_type_offsets.h" -exec cp {} "${SDNA_TARGET_CXX}/" \; -exec cp {} "${SDNA_TARGET_SRC_INTERN}/" \; -exec cp {} "${SDNA_TARGET_SRC_ROOT}/" \; 2>/dev/null || true
          find "${PARENT_ROOT}" -name "dna_verify.c" -exec cp {} "${SDNA_TARGET_CXX}/" \; -exec cp {} "${SDNA_TARGET_SRC_INTERN}/" \; 2>/dev/null || true

          echo "=== STAGE 4: Building libmakesrna.a and Prerequisites ==="
          if [ -d "${MAKEBLENDER_CXX}" ]; then
            # Build makesrna AND ghost library needed by MakeSRNA
            ninja -C "${MAKEBLENDER_CXX}" makesrna bf_intern_ghost || true
          fi

          echo "=== STAGE 5: Running MakeSRNA & Copying RNA Files ==="
          cd "${PARENT_ROOT}/Utilities-android_arm64/MakeSRNA"
          gradle assembleRelease

          RNA_TARGET_INTERN="${MAKEBLENDER_CXX}/source/blender/makesrna/intern"
          RNA_TARGET_CYCLES="${PARENT_ROOT}/Blender-android_arm64/intern/cycles/blender"
          RNA_TARGET_SOURCE="${PARENT_ROOT}/Blender-android_arm64/source/blender/makesrna"
          
          mkdir -p "${RNA_TARGET_INTERN}" "${RNA_TARGET_CYCLES}" "${RNA_TARGET_SOURCE}"
          
          find "${PARENT_ROOT}" -name "RNA_*.h" -exec cp {} "${RNA_TARGET_CYCLES}/" \; 2>/dev/null || true
          find "${PARENT_ROOT}" -name "RNA_*.h" -exec cp {} "${RNA_TARGET_SOURCE}/" \; 2>/dev/null || true
          find "${PARENT_ROOT}" -name "*.c" -path "*/makesrna/*" -exec cp {} "${RNA_TARGET_INTERN}/" \; 2>/dev/null || true

          echo "=== STAGE 6: Full Core Blender Compilation ==="
          cd "${PARENT_ROOT}/Utilities-android_arm64/MakeBlender"
          gradle assembleRelease
          
      - name: Build Android APK (OBlender)
        run: |
          PARENT_ROOT=$(cd "${GITHUB_WORKSPACE}/.." && pwd)
          cd "${PARENT_ROOT}/APP-android_arm64/OBlender"
          gradle assembleDebug

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blender-3.6-Zink-ARM64
          path: |
            ${{ github.workspace }}/../**/*.apk
