name: Build Blender 3.6 LTS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Toolchain & Environments Setup
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # CACHE LAYER: Prevents downloading 1GB NDK on every run
      - name: Cache Android NDK r21e
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk-r21e
          key: ndk-r21e-linux-x86_64

      - name: Install NDK if not cached
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/ndk-download
          curl -L -o $HOME/ndk-download/ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q $HOME/ndk-download/ndk.zip -d $HOME/
          rm -rf $HOME/ndk-download

      - name: Configure NDK Environment Path
        run: |
          mkdir -p $ANDROID_HOME/ndk
          ln -s $HOME/android-ndk-r21e $ANDROID_HOME/ndk/21.4.7075529

      # Step 2: System Dependencies & Repository Sync
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 gettext git

      - name: Clone Sibling Repositories
        run: |
          cd ..
          git clone --depth 1 https://github.com/dshawshank/lib-android_arm64.git lib-android_arm64
          git clone --depth 1 https://github.com/dshawshank/Utilities-android_arm64.git Utilities-android_arm64
          git clone --depth 1 --branch blender-v3.6-release https://github.com/dshawshank/Blender-android_arm64.git Blender-android_arm64

      # Step 3: Fixed Target Header Configurations
      - name: Structuring Dependency Headers
        run: |
          echo "=== Structuring CPython, PNG & Cycles RNA Headers ==="
          LIB_ROOT="${GITHUB_WORKSPACE}/.."
          LIB_ANDROID="${LIB_ROOT}/lib-android_arm64"
          BLENDER_ROOT="${LIB_ROOT}/Blender-android_arm64"
          
          # 1. CPython Dual Include Mirroring
          PY_SRC_DIR=$(dirname $(find "${LIB_ANDROID}/cpython" -name "Python.h" | head -n 1))
          if [ -n "${PY_SRC_DIR}" ]; then
            mkdir -p "${LIB_ANDROID}/cpython/include/include"
            cp -r "${PY_SRC_DIR}"/* "${LIB_ANDROID}/cpython/include/" 2>/dev/null || true
            cp -r "${PY_SRC_DIR}"/* "${LIB_ANDROID}/cpython/include/include/" 2>/dev/null || true
          fi

          # 2. PNG Header Sync
          find "${LIB_ANDROID}/Png" -name "pnglibconf.h.prebuilt" -execdir cp -n {} pnglibconf.h \; 2>/dev/null || true
          PNG_TARGET=$(dirname $(find "${LIB_ANDROID}/Png" -name "png.h" | head -n 1))
          if [ -n "${PNG_TARGET}" ]; then
            find "${LIB_ANDROID}/Png" -name "*.h" -exec cp -n {} "${PNG_TARGET}/" 2>/dev/null \; || true
          fi

          # 3. Sync RNA C++ Headers into Cycles
          RNA_HEADER=$(find "${LIB_ROOT}" -name "RNA_blender_cpp.h" | head -n 1)
          if [ -n "${RNA_HEADER}" ]; then
            RNA_DIR=$(dirname "${RNA_HEADER}")
            CYCLES_TARGET="${BLENDER_ROOT}/intern/cycles/blender"
            echo "Copying RNA headers from ${RNA_DIR} to ${CYCLES_TARGET}"
            mkdir -p "${CYCLES_TARGET}"
            cp "${RNA_DIR}"/RNA_*.h "${CYCLES_TARGET}/" 2>/dev/null || true
          fi

      - name: Setup Gradle 6.9.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.9.4'

      - name: Patch Hardcoded Windows Paths
        run: |
          echo "=== Patching Windows paths dynamically ==="
          PARENT_ROOT=$(cd "${GITHUB_WORKSPACE}/.." && pwd)
          echo "Target Parent Root resolved to: ${PARENT_ROOT}"
          
          find "${PARENT_ROOT}" -type f \( -name "*.cmake" -o -name "*.txt" -o -name "*.gradle" -o -name "*.ninja" -o -name "*.properties" \) -exec sed -i "s|D:/FreeProjects/Blender/Blender|${PARENT_ROOT}|g" {} +

      # Step 4: Compilations
      - name: Build Core Blender Static Libraries
        run: |
          cd "${GITHUB_WORKSPACE}/../Utilities-android_arm64/MakeBlender"
          gradle assembleRelease
          
      - name: Build Android APK
        run: |
          if [ -d "${GITHUB_WORKSPACE}/OBlender" ]; then
            cd "${GITHUB_WORKSPACE}/OBlender"
          elif [ -d "${GITHUB_WORKSPACE}/../Utilities-android_arm64/OBlender" ]; then
            cd "${GITHUB_WORKSPACE}/../Utilities-android_arm64/OBlender"
          fi
          gradle assembleDebug

      # Step 5: Artifact Export
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blender-3.6-Zink-ARM64
          path: |
            ${{ github.workspace }}/**/*.apk
            ${{ github.workspace }}/../**/*.apk
