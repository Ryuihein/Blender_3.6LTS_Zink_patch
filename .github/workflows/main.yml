name: Build Blender Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Environment & Toolchain Setup
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11 (Required for Gradle 6.5)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Download and Install NDK 21.4.7075529 (r21e)
        run: |
          mkdir -p $ANDROID_HOME/ndk
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q ndk.zip -d $ANDROID_HOME/ndk/
          mv $ANDROID_HOME/ndk/android-ndk-r21e $ANDROID_HOME/ndk/21.4.7075529
          rm ndk.zip

      - name: Verify NDK Toolchain Setup
        run: |
          echo "NDK Location: ${ANDROID_HOME}/ndk/21.4.7075529"
          ls -la ${ANDROID_HOME}/ndk/21.4.7075529

      # Step 2: Build Tools & Sibling Repositories
      - name: Install CMake, Ninja & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 gettext git

      - name: Clone Sibling Repositories
        run: |
          cd ..
          git clone https://github.com/dshawshank/lib-android_arm64.git lib-android_arm64
          git clone https://github.com/dshawshank/Utilities-android_arm64.git Utilities-android_arm64
          git clone --branch blender-v3.6-release https://github.com/dshawshank/Blender-android_arm64.git Blender-android_arm64

      - name: Verify Workspace Directory
        run: |
          echo "=== Workspace Root Folders ==="
          ls -la ..
