name: Build Blender 3.6 LTS apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "11"

      - name: Set up QEMU and Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static \
            binfmt-support \
            unzip \
            curl \
            cmake \
            ninja-build \
            python3 \
            gettext \
            git

      - name: Cache Android NDK r21e
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk-r21e
          key: ndk-r21e-linux-x86_64

      - name: Install NDK if not cached
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/ndk-download"
          curl -fL \
            -o "$HOME/ndk-download/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip"
          unzip -q "$HOME/ndk-download/ndk.zip" -d "$HOME"
          rm -rf "$HOME/ndk-download"

      - name: Configure NDK Environment Path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/ndk"
          if [ -L "$ANDROID_HOME/ndk/21.4.7075529" ] || [ -e "$ANDROID_HOME/ndk/21.4.7075529" ]; then
            rm -rf "$ANDROID_HOME/ndk/21.4.7075529"
          fi
          ln -s "$HOME/android-ndk-r21e" "$ANDROID_HOME/ndk/21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Setup Gradle 6.9.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "6.9.4"

      - name: Clone All Sibling Repositories
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          git clone --depth 1 https://github.com/dshawshank/lib-android_arm64.git lib-android_arm64
          git clone --depth 1 https://github.com/dshawshank/Utilities-android_arm64.git Utilities-android_arm64
          git clone --depth 1 --branch blender-v3.6-release https://github.com/dshawshank/Blender-android_arm64.git Blender-android_arm64
          git clone --depth 1 https://github.com/dshawshank/APP-android_arm64.git APP-android_arm64

      - name: Structuring Dependency Headers
        shell: bash
        run: |
          set -euo pipefail
          LIB_ROOT="${GITHUB_WORKSPACE}/.."
          LIB_ANDROID="${LIB_ROOT}/lib-android_arm64"

          # CPython Header Sync
          PYTHON_HEADER="$(find "${LIB_ANDROID}/cpython" -name Python.h -type f -print -quit || true)"
          if [ -n "${PYTHON_HEADER}" ]; then
            PY_SRC_DIR="$(dirname "${PYTHON_HEADER}")"
            mkdir -p "${LIB_ANDROID}/cpython/include/include"
            cp -r "${PY_SRC_DIR}/." "${LIB_ANDROID}/cpython/include/"
            cp -r "${PY_SRC_DIR}/." "${LIB_ANDROID}/cpython/include/include/"
          fi

          # PNG Header Sync
          PNG_PREBUILT="$(find "${LIB_ANDROID}/Png" -name pnglibconf.h.prebuilt -type f -print -quit || true)"
          if [ -n "${PNG_PREBUILT}" ]; then
            cp -f "${PNG_PREBUILT}" "$(dirname "${PNG_PREBUILT}")/pnglibconf.h"
          fi

          PNG_HEADER="$(find "${LIB_ANDROID}/Png" -name png.h -type f -print -quit || true)"
          if [ -n "${PNG_HEADER}" ]; then
            PNG_TARGET="$(dirname "${PNG_HEADER}")"
            find "${LIB_ANDROID}/Png" -name "*.h" -type f -exec cp -n {} "${PNG_TARGET}/" \;
          fi

      - name: Patch Hardcoded Windows Paths
        shell: bash
        run: |
          set -euo pipefail
          PARENT_ROOT="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
          find "${PARENT_ROOT}" -type f \( -name "*.cmake" -o -name "*.txt" -o -name "*.gradle" -o -name "*.ninja" -o -name "*.properties" \) \
            -exec sed -i \
              -e "s|D:/FreeProjects/Blender/Blender|${PARENT_ROOT}|g" \
              -e "s|D:\\\\FreeProjects\\\\Blender\\\\Blender|${PARENT_ROOT}|g" \
              {} +

      - name: Multi-Stage Bootstrap Build
        shell: bash
        run: |
          set -euo pipefail
          PARENT_ROOT="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
          BLENDER_SRC="${PARENT_ROOT}/Blender-android_arm64"
          MAKEBLENDER_DIR="${PARENT_ROOT}/Utilities-android_arm64/MakeBlender"
          MAKEBLENDER_CXX="${MAKEBLENDER_DIR}/app/.cxx/cmake/release/arm64-v8a"
          UTILITIES_DIR="${PARENT_ROOT}/Utilities-android_arm64/Utilities"

          echo "=== STAGE 1: Generate Android CMake Configuration ==="
          cd "${MAKEBLENDER_DIR}"
          gradle :app:generateJsonModelRelease || true

          # Build host code-generator tools
          ninja -C "${MAKEBLENDER_CXX}" makesdna msgfmt datatoc || true

          # Safely sync helper binaries to creator directories
          mkdir -p "${MAKEBLENDER_CXX}/source/creator"
          for tool in msgfmt datatoc; do
            if [ -f "${MAKEBLENDER_CXX}/bin/${tool}" ]; then
              cp -f "${MAKEBLENDER_CXX}/bin/${tool}" "${MAKEBLENDER_CXX}/source/creator/${tool}"
            elif [ -f "${UTILITIES_DIR}/${tool}" ]; then
              cp -f "${UTILITIES_DIR}/${tool}" "${MAKEBLENDER_CXX}/source/creator/${tool}"
              cp -f "${UTILITIES_DIR}/${tool}" "${MAKEBLENDER_CXX}/bin/${tool}"
            fi
          done

          echo "=== STAGE 2: Native Host Build & Run for MakeSDNA ==="
          # Locate generated dna_includes_as_strings.h header directory from CMake output
          DNA_STRINGS_HEADER="$(find "${PARENT_ROOT}" -name "dna_includes_as_strings.h" -type f -print -quit || true)"
          DNA_INC_ARG=""
          if [ -n "${DNA_STRINGS_HEADER}" ]; then
            DNA_INC_ARG="-I$(dirname "${DNA_STRINGS_HEADER}")"
          fi

          # Compile makesdna natively on Ubuntu runner with dynamically found generated headers
          gcc -O2 "${BLENDER_SRC}/source/blender/makesdna/intern/makesdna.c" \
            -I"${BLENDER_SRC}/source/blender/makesdna" \
            -I"${BLENDER_SRC}/source/blender/makesdna/intern" \
            -I"${BLENDER_SRC}/intern/guardedalloc" \
            -I"${BLENDER_SRC}/source/blender/blenlib" \
            -I"${MAKEBLENDER_CXX}/source/blender/makesdna/intern" \
            -I"${MAKEBLENDER_CXX}/source/blender/makesdna" \
            ${DNA_INC_ARG} \
            -o "${PARENT_ROOT}/host_makesdna"

          SDNA_TARGET_CXX="${MAKEBLENDER_CXX}/source/blender/makesdna/intern"
          SDNA_TARGET_SRC="${BLENDER_SRC}/source/blender/makesdna/intern"
          mkdir -p "${SDNA_TARGET_CXX}" "${SDNA_TARGET_SRC}"

          "${PARENT_ROOT}/host_makesdna" \
            "${SDNA_TARGET_CXX}/dna.c" \
            "${SDNA_TARGET_CXX}/dna_type_offsets.h" \
            "${SDNA_TARGET_CXX}/dna_verify.c" \
            "${BLENDER_SRC}/source/blender/makesdna/"

          sed -i "s|/data/data/com.epai.makesdna/makesdna|${BLENDER_SRC}/source/blender/makesdna|g" "${SDNA_TARGET_CXX}/dna_verify.c"
          cp -f "${SDNA_TARGET_CXX}"/* "${SDNA_TARGET_SRC}/" 2>/dev/null || true

          echo "=== STAGE 3: Build MakesRNA Prerequisites ==="
          cd "${MAKEBLENDER_DIR}"
          ninja -C "${MAKEBLENDER_CXX}" makesrna bf_intern_ghost || true

          echo "=== STAGE 4: Sync RNA Structural Files ==="
          RNA_TARGET_CXX="${MAKEBLENDER_CXX}/source/blender/makesrna/intern"
          RNA_TARGET_SOURCE="${BLENDER_SRC}/source/blender/makesrna"
          mkdir -p "${RNA_TARGET_CXX}" "${RNA_TARGET_SOURCE}"

          find "${PARENT_ROOT}" -name "RNA_*.h" -exec cp -f {} "${RNA_TARGET_SOURCE}/" \; 2>/dev/null || true
          find "${PARENT_ROOT}" -name "*.c" -path "*/makesrna/*" -exec cp -f {} "${RNA_TARGET_CXX}/" \; 2>/dev/null || true

          echo "=== STAGE 5: Full Core Blender Library Compilation ==="
          cd "${MAKEBLENDER_DIR}"
          gradle assembleRelease

      - name: Build Android APK (OBlender)
        shell: bash
        run: |
          set -euo pipefail
          PARENT_ROOT="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
          cd "${PARENT_ROOT}/APP-android_arm64/OBlender"
          gradle assembleDebug

      - name: Collect APK Artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="${GITHUB_WORKSPACE}/output"
          mkdir -p "${OUTPUT_DIR}"

          find "${GITHUB_WORKSPACE}/.." \
            -type f \
            -name "*.apk" \
            -exec cp -f {} "${OUTPUT_DIR}/" \;

          echo "Collected APK files:"
          find "${OUTPUT_DIR}" -type f -name "*.apk" -print

          if ! find "${OUTPUT_DIR}" -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK files were found"
            exit 1
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blender-3.6-Zink-ARM64
          path: ${{ github.workspace }}/output/*.apk
          if-no-files-found: error
