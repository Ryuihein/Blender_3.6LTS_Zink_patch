name: Build Blender 3.6 LTS for Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            python3 \
            libx11-dev \
            libxxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libglew-dev

      - name: Checkout Blender Source (v3.6.15)
        run: |
          git clone --depth 1 --branch v3.6.15 https://projects.blender.org/blender/blender.git blender-src

      - name: STAGE 1 - Build Host Code Generators (makesdna & makesrna)
        run: |
          mkdir -p build_host
          cd build_host

          # Configure minimal x86_64 host build required for DNA/RNA generators
          cmake ../blender-src \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_PYTHON=OFF \
            -DWITH_INTERNATIONAL=OFF \
            -DWITH_CYCLES=OFF \
            -DWITH_BUILDINFO=OFF \
            -DWITH_OPENMP=OFF \
            -DWITH_HEADLESS=ON

          # Build host executables
          ninja makesdna makesrna

      - name: STAGE 2 - Run Host Code Generators & Pre-Generate DNA/RNA Files
        run: |
          BLENDER_SRC="$(pwd)/blender-src"
          HOST_BIN="$(pwd)/build_host/bin"

          # Create target output directories inside source tree
          mkdir -p "${BLENDER_SRC}/source/blender/makesdna/intern"
          mkdir -p "${BLENDER_SRC}/source/blender/makesrna/intern"

          echo "=== Generating DNA Files ==="
          "${HOST_BIN}/makesdna" \
            "${BLENDER_SRC}/source/blender/makesdna/intern/dna.c" \
            "${BLENDER_SRC}/source/blender/makesdna/intern/dna_type_offsets.h" \
            "${BLENDER_SRC}/source/blender/makesdna/intern/dna_verify.c" \
            "${BLENDER_SRC}/source/blender/makesdna/"

          echo "=== Generating RNA Files ==="
          "${HOST_BIN}/makesrna" \
            "${BLENDER_SRC}/source/blender/makesrna/intern/" \
            "${BLENDER_SRC}/source/blender/makesrna/intern/"

      - name: STAGE 3 - Cross-Compile Blender for Android ARM64
        run: |
          BLENDER_SRC="$(pwd)/blender-src"
          NDK_PATH="${ANDROID_NDK_LATEST_HOME}"

          mkdir -p build_android
          cd build_android

          # Configure CMake with Android NDK Toolchain
          cmake "${BLENDER_SRC}" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_PYTHON=OFF \
            -DWITH_INTERNATIONAL=OFF \
            -DWITH_CYCLES=OFF \
            -DWITH_BUILDINFO=OFF \
            -DWITH_OPENMP=OFF \
            -DWITH_OPENGL=ON \
            -DWITH_GHOST_SDL=OFF \
            -DWITH_HEADLESS=ON

          # Compile ARM64 Android Binaries / Libraries
          ninja -j$(nproc)

      - name: STAGE 4 - Package and Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-3.6-android-arm64
          path: |
            build_android/bin/
            build_android/lib/
